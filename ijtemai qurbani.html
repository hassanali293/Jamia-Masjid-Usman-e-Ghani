<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Khidmat Ijtemai Qurbani 2026</title>
    <!-- Tailwind CSS CDN for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for a cleaner look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
            /* bg-slate-200 */
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">
    <!-- Main content container -->
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-2xl w-full text-center border border-gray-200">

        <!-- Header Section -->
        <header class="mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold text-green-700 mb-2">
                Al Khidmat
            </h1>
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">
                Ijtemai Qurbani 2026
            </h2>
        </header>

        <!-- Location Details Section -->
        <section class="mb-8 p-6 bg-gray-50 rounded-xl border border-gray-100 shadow-inner">
            <h3 class="text-xl font-bold text-gray-700 mb-2">Markaz Location</h3>
            <p class="text-lg text-gray-600">
                Jamia Masjid Usman-e-Ghani, Sector 5-A/1, ST-11, North Karachi.
            </p>
        </section>

        <!-- Cow Quantity Section -->
        <section class="mb-8 p-6 bg-yellow-100 rounded-xl border border-yellow-200 shadow-inner">
            <h3 class="text-xl font-bold text-yellow-800 mb-2">Total Cow Quantity</h3>
            <p class="text-3xl font-bold text-yellow-900">30</p>
        </section>

        <!-- Cow Sacrifice Status Section -->
        <section class="p-6 bg-green-100 rounded-xl border border-green-200 shadow-lg">
            <h3 class="text-xl font-bold text-green-800 mb-4">Cow Sacrifice Status</h3>

            <!-- Input form to check status -->
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 mb-4">
                <input type="text" id="referenceNumber" placeholder="Enter your reference number (1-30)"
                    class="p-3 w-full md:w-auto flex-grow rounded-lg border border-green-300 focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-300">
                <button id="checkStatusBtn"
                    class="w-full md:w-auto px-6 py-3 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition duration-300">
                    Check Status
                </button>
            </div>

            <!-- Status display area -->
            <div id="statusResult"
                class="min-h-[50px] p-4 bg-white rounded-lg border border-gray-200 shadow-sm transition-all duration-300 text-gray-700 font-medium">
                <!-- Status will be displayed here dynamically -->
                <p>Please enter your reference number to check the status.</p>
            </div>
        </section>

        <!-- Footer -->
        <footer class="mt-8 text-sm text-gray-500">
            &copy; 2026 Al Khidmat Foundation. All rights reserved.
        </footer>
    </div>

    <script>
        // Get references to the DOM elements
        const checkStatusBtn = document.getElementById('checkStatusBtn');
        const referenceNumberInput = document.getElementById('referenceNumber');
        const statusResultDiv = document.getElementById('statusResult');

        /**
         * Simulates a database or API call to get the sacrifice status.
         * For this demo, we're using a simple object to map reference numbers to statuses.
         * @param {string} refNo - The reference number to check.
         * @returns {string} The status message.
         */
        function getSacrificeStatus(refNo) {
            // Convert input to a number and trim whitespace
            const refNum = parseInt(refNo.trim());

            // Check if the input is a valid number within the range
            if (isNaN(refNum) || refNum < 1 || refNum > 30) {
                return 'Invalid reference number. Please enter a number between 1 and 30.';
            }

            // A simple object to hold dummy status data for each cow
            const statusData = {
                1: 'گائے نمبر 1 کی قربانی ہو چکی ہے اور گوشت تیار ہے۔',
                2: 'Cow #2 has been sacrificed.',
                3: 'Cow #3 is at the location, awaiting sacrifice.',
                4: 'Cow #4 is ready for sacrifice.',
                5: 'Cow #5 has been sacrificed and meat distributed.',
                6: 'Cow #6 is at the location, awaiting sacrifice.',
                7: 'Cow #7 is ready for sacrifice.',
                8: 'Cow #8 is ready for sacrifice.',
                9: 'Cow #9 is at the location, awaiting sacrifice.',
                10: 'Cow #10 has been sacrificed and meat distributed.',
                11: 'Cow #11 is ready for sacrifice.',
                12: 'Cow #12 is ready for sacrifice.',
                13: 'Cow #13 is at the location, awaiting sacrifice.',
                14: 'Cow #14 is at the location, awaiting sacrifice.',
                15: 'Cow #15 has been sacrificed.',
                16: 'Cow #16 is ready for sacrifice.',
                17: 'Cow #17 has been sacrificed and meat distributed.',
                18: 'Cow #18 is at the location, awaiting sacrifice.',
                19: 'Cow #19 has been sacrificed.',
                20: 'Cow #20 is ready for sacrifice.',
                21: 'Cow #21 is at the location, awaiting sacrifice.',
                22: 'Cow #22 has been sacrificed and meat distributed.',
                23: 'Cow #23 is ready for sacrifice.',
                24: 'Cow #24 is at the location, awaiting sacrifice.',
                25: 'Cow #25 has been sacrificed.',
                26: 'Cow #26 is ready for sacrifice.',
                27: 'Cow #27 is at the location, awaiting sacrifice.',
                28: 'Cow #28 has been sacrificed.',
                29: 'Cow #29 is at the location, awaiting sacrifice.',
                30: 'Cow #30 has been sacrificed and meat distributed.'
            };

            // Return the status from the object
            return statusData[refNum];
        }

        // Add a click event listener to the button
        checkStatusBtn.addEventListener('click', () => {
            const refNumber = referenceNumberInput.value;
            if (refNumber.length > 0) {
                // Get the status based on the input
                const status = getSacrificeStatus(refNumber);
                // Update the status display area
                statusResultDiv.innerHTML = `<p>${status}</p>`;
            } else {
                // Handle empty input
                statusResultDiv.innerHTML = `<p class="text-red-500">Please enter a reference number.</p>`;
            }
        });
    </script>
</body>

</html>
